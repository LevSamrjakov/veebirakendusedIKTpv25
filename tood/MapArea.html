<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Map Area</title>
</head>
<body>
<h1>Map Area kasutamine</h1>
<h2>Tuleb klikida: Rogal Dorn Battle Tank, Scout Sentinel, Armored Sentinel, Chimera Transport, Cadian Shock Troops, Cadian Command Squad, Heavy Weapons Squad</h2>
<img src="9191855.jpg" alt="Astra Militarum pilt" usemap="#AstraMilitarumPilt">
<map name="AstraMilitarumPilt">
    <area shape="circle" coords="1080, 410, 150"
          href="https://www.warhammer.com/en-EU/shop/astra-militarum-rogal-dorn-battle-tank-2023" alt="RogalDornBattleTank" target="_blank">
    <!-- Circle coords = (x, y, R) -->
    <area shape="circle" coords="1700, 300, 100"
          href="https://www.warhammer.com/en-EU/shop/astra-militarum-scout-sentinel-2023" alt="ScoutSentinel">
    <!-- Rectangle coords = (x, y, x1, y2 -->
    <area shape="circle" coords="740, 150, 100"
          href="https://www.warhammer.com/en-EU/shop/astra-militarum-armoured-sentinel-2023" alt="ArmoredSentinel">

    <area shape="circle" coords="110, 140, 100"
          href="https://www.warhammer.com/en-EU/shop/Imperial-Guard-Chimera" alt="ChimeraTransport">

    <area shape="circle" coords="275, 565, 100"
          href="https://www.warhammer.com/en-EU/shop/astra-militarum-cadian-heavy-weapons-squad-2023" alt="HeavyWeaponsSquad">

    <area shape="rect" coords="545, 610, 1325, 1060"
          href="https://www.warhammer.com/en-EU/shop/astra-militarum-cadian-shock-troops-2023" alt="CadianShockTroops">

    <area shape="circle" coords="1370, 140, 100"
          href="https://www.warhammer.com/en-EU/shop/astra-militarum-cadian-command-squad-2023" alt="CadianCommandSquad">
</map>
<div>Palun tee klick hiirega pildi peal!</div>
</body>
</html>
