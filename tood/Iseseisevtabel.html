<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Iseseisev töö</title>
    <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<h1>Iseseisevtabel</h1>
<table id="Iseseisevtabel1">
    <tr>
        <td rowspan="3">A</td>
        <td rowspan="2" colspan="2">C</td>
        <td colspan="2">1</td>
    </tr>
    <tr>
        <td colspan="2">2</td>
    </tr>
    <tr>
        <td rowspan="2">D</td>
        <td rowspan="2" colspan="3">E</td>
    </tr>
    <tr>
        <td rowspan="3">B</td>
    </tr>
    <tr>
        <td></td>
        <td rowspan="2">I</td>
        <td colspan="2">+</td>
    </tr>
    <tr>
        <td></td>
        <td>+</td>
        <td>+</td>
    </tr>
</table>
<h1>Iseseisevtabel 2</h1>
<table id="Iseseisevtabel2">
    <tr>
        <td colspan="5">A</td>
    </tr>
    <tr>
        <td colspan="3">B</td>
        <td rowspan="2">C</td>
        <td rowspan="2">D</td>
    </tr>
    <tr>
        <td rowspan="2">1</td>
        <td>2</td>
        <td rowspan="2">4</td>
    </tr>
    <tr>
        <td>3</td>
        <td colspan="2">E</td>
    </tr>
</table>
</body>
</html>
