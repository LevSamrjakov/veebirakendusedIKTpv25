<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Piltide vahetus JS abil</title>
    <link rel="stylesheet" href="piltStyle.css">
    <script src="../js/piltScript.js"></script>
</head>
<body>
<h1 id="header1">Juhuslik pilt</h1>

<section id="piltSection">
    <img src="../images/lill.png" alt="" id="randomPilt">
    <input type="button" onclick="juhuslikPilt()" value="Vaheta pilt">
</section>

<h2 id="header2">Mõistatus. Arva ära mida näed pildil?</h2>

<section id="piltSelect">
    <label for="valik">Tee oma valik:</label>
    <select name="valik" id="valik" onchange="selectValik()">
        <option value="vali...">vali...</option>
        <option value="../images/smile.png">Smile</option>
        <option value="../images/neutral.png">Neutral</option>
        <option value="../images/kurb.png">Kurb</option>
        <option value="../images/lill.png">Lill</option>
    </select>
    <div id="vastus">Siia tuleb vastus</div>
</section>

<section id="valik2">
    <h2>Pildi kuvamiseks tee oma valiku</h2>
    <input type="radio" name="piltValik" id="v1" value="../images/smile.png" onclick="raadioValik()">
    <label for="v1">Smile pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v2" value="../images/neutral.png" onclick="raadioValik()">
    <label for="v2">Neutral pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v3" value="../images/lill.png" onclick="raadioValik()">
    <label for="v3">Lill pilt</label>
    <br>
    <input type="radio" name="piltValik" id="v4" value="../images/kurb.png" onclick="raadioValik()">
    <label for="v4">Kurb pilt</label>
    <br>
    <img src="" alt="" id="valitudPilt">
</section>

</body>
</html>
