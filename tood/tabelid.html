<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
    <link rel="stylesheet" href="tabelStyle.css">
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id = "Lihtne">
    <tr>
        <td class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>Tabel kus on ühendatud lahtrid</h2>
<table id = "Keeruline1">
    <tr>
        <td colspan="2" class="nimia">A</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2>Veel üks tabel kus on ühendatud lahtrid</h2>
<table id = "Keeruline2">
    <tr>
        <td rowspan="2" class="nimia">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>D</td>
    </tr>
</table>
<h2>Keeruline tabel ülesanne</h2>
<table id = "Keeruline3">
    <tr>
        <td rowspan="4" class="nimia">A</td>
        <td colspan="4">B</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
        <td rowspan="3" colspan="2" class="aimin">E</td>
    </tr>
    <tr>
        <td colspan="2">F</td>
    </tr>
    <tr>
        <td colspan="2">G</td>
    </tr>
</table>
</body>
</html>
