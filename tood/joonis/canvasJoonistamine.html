<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Canvas joonistamine</title>
    <link rel="stylesheet" href="canvasStyle.css">
    <script src="canvasScript.js"></script>
</head>
<body>
<h1>Joonistusrakendus Canvas + JavaScript</h1>
<canvas id="canvas" width="400" height="400"></canvas>
<table>
    <tr>
        <td>
            <input type="button" value="joon" onclick="joon()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="kolmnurk" onclick="kolmnurk()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ristkülik" onclick="ristkylik()">
            <label for="laius">Laius:</label>
            <input type="number" id="laius" min="1" max="200" step="1" onchange="ring()">
            <label for="kyrgus">Kõrgus:</label>
            <input type="number" id="kyrgus" min="1" max="200" step="1" onchange="ring()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="ümberjoon" onclick="ring()">
            <label for="raadius">Raadius:</label>
            <input type="number" id="raadius" min="1" max="50" step="1" onchange="ring()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="pilt" onclick="pilt()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Ratas 1" onclick="ratas1()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Ratas 2" onclick="ratas2()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="Kere" onclick="kere()">
        </td>
    </tr>
    <tr>
        <td>
            <input type="button" value="puhasta" onclick="puhasta()">
        </td>
    </tr>
</table>
</body>
</html>
