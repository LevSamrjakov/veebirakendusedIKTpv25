<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika Küsimustik</title>
    <link rel="stylesheet" href="vormStyle.css">
    <script src = "../JavaScript/kysimustikScript.js"></script>
</head>
<body>
<h1>Muusika Küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab = komentaar -->
    <table>
        <tr>
            <td>
                <!-- Tekstkast -->
                <label for="nimi">Nimi:</label>
            </td>
            <td>
                <input type="text" id="nimi" placeholder="Lev" oninput="nimiLugemineKastist()">;
            </td>
            <td>
                <div id="Vastus1"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- ripploend või rippmenüü (en: dropdown list) -->
                <label for="stiil">Vali meeldivaim muusikastiil:</label>
            </td>
            <td>
                <select name="stiil" id="stiil" onchange="selectValik()">
                    <option value="vali">Vali...</option>
                    <option value="rock">Rock</option>
                    <option value="metal">Metal</option>
                    <option value="heavyMetal">Heavy Metal</option>
                    <option value="hardRock">Hard Rock</option>
                    <option value="neueDeutscheHärte">Neue Deutsche Härte</option>
                </select>
            </td>
            <td>
                <div id="vastus5"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- radio nupud - üks valik mitmest -->
                <strong>
                    Kuidas sa muusikat peamiselt kuulad?
                </strong>
            </td>
            <td>
                <input type="radio" name="platvorm" id="spotify" value="spotify" onclick="radioValik()">
                <label for="spotify">Spotify</label>
                <br>
                <input type="radio" name="platvorm" id="youtubeMusic" value="youtubeMusic" onclick="radioValik()">
                <label for="youtubeMusic">YouTube Music</label>
                <br>
                <input type="radio" name="platvorm" id="soundcloud" value="soundcloud" onclick="radioValik()">
                <label for="soundcloud">Soundcloud</label>
                <br>
                <input type="radio" name="platvorm" id="raadio" value="raadio" onclick="radioValik()">
                <label for="raadio">Raadio</label>
                <br>
                <input type="radio" name="platvorm" id="vinüüplaat" value="vinüüplaat" onclick="radioValik()">
                <label for="vinüüplaat">Vinüüplaat</label>
            </td>
            <td>
                <div id="Vastus2"></div>
            </td>
        </tr>
        <tr>
            <td colspan="2">
                <!-- checkbox -->
                <fieldset>
                    <legend>Tee oma valikud - lemmik ansambel</legend>
                    <input type="checkbox" name="lemmikud" id="rollingstones" value="rolling stones" onchange="checkboxValik()">
                    <label for="rollingstones">Rolling Stones</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="judaspriest" value="judas priest" onchange="checkboxValik()">
                    <label for="judaspriest">Judas Priest</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="manowar" value="manowar" onchange="checkboxValik()">
                    <label for="manowar">Manowar</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="deepPurple" value="deep Purple" onchange="checkboxValik()">
                    <label for="deepPurple">Deep Purple</label>
                    <br>
                    <input type="checkbox" name="lemmikud" id="rammstein" value = "rammstein" onchange="checkboxValik()">
                    <label for="rammstein">Rammstein</label>
                    <br>
                </fieldset>
            </td>
            <td>
                <div id="vastus3"></div>
            </td>
        </tr>
        <tr>
            <td>
                <!-- range - vahemik -->
                <label for="tund">
                    Mitu tundi päevas sa kuulad muusikat?
                </label>
            </td>
            <td>
                0<input type="range" id="tund" min="0" max="24" onchange="rangeValik()">24
            </td>
            <td>
                <div id="vastus4"></div>
            </td>
            <!-- Input type: color, file, email, image,  -->
        </tr>
        <tr>
            <td>
                <!-- color - värv -->
                <label for="värv">
                    Millist värvi sa seostad oma lemmik muusika ansambeliga?
                </label>
            </td>
            <td><input type="color" id="värv"></td>
        </tr>
        <tr>
            <td>
                <label for="fail">
                    Sisesta oma lemmik laulu faili:
                </label>
            </td>
            <td>
                <input type="file" id="fail">
            </td>
        <tr>
            <td>
                <label for="hindamine">
                    Hinda minu vormi:
                </label>
            </td>
            <td>
                <input type="number" id="hindamine" min="0" max="5">
            </td>
        </tr>
        <tr>
            <td>
                <label for="epost">E-Post:</label>
            </td>
            <td>
                <input type="email" id="epost">
            </td>
        </tr>
        <tr>
            <td>
                <label for="pilt">
                    Esita oma vastused:
                </label>
            </td>
            <td>
                <input type="image" id="pilt" src="img_submit.gif" alt="Submit" width="48" height="48">
            </td>
        </tr>
        <tr>
            <td>
                <label for="arvamus">Mida arvad muusika kuulamisest koolis?</label>
            </td>
            <td>
                <textarea name="arvamus" id="arvamus" cols="30" rows="10" oninput="arvamuselugemine()"></textarea>
            </td>
            <td>
                <div id="vastus6"></div>
            </td>
        </tr>
        <tr>
            <td>
                <strong>
                    Kas sa kuulad raadiot?
                </strong>
            </td>
            <td>
                <input type="radio" name="kuuladRaadio" id="KuulanRadio" value="Jah" onclick="KuuladRaadio()">
                <label for="KuulanRadio">Yes</label>
                <br>
                <input type="radio" name="kuuladRaadio" id="eiKuulanRadio" value="Ei" onclick="KuuladRaadio()">
                <label for="eiKuulanRadio">No</label>
            </td>
            <td>
                <div id="vastus8"></div>
            </td>
        </tr>
        <tr>
            <td>
                <label for="raadiojaam">Milliseid raadiojaamu oskad nimetada?</label>
            </td>
            <td>
                <input type="text" id="raadiojaam" oninput="raadiojaamad()">
            </td>
            <td>
                <div id="vastus7"></div>
            </td>
        </tr>
        <tr>
            <td>
                <input type="reset" value = "Puhasta" onclick = "puhasta()">
            </td>
            <td>
                <input type="button" value = "Näita/Loe andmed" onclick = "näitaKõike()">
            </td>
            <td>
                <div id="vastusKõik"></div>
            </td>
        </tr>
    </table>
</form>
</body>
</html>
