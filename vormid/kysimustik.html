<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Muusika Küsimustik</title>
</head>
<body>
<h1>Muusika Küsimustik</h1>
<div>HTML vormid ja nupud</div>
<form action="#">
    <!-- c + tab = komentaar -->
    <!-- Tekstkast -->
    <label for="nimi">Nimi:</label>
    <input type="text" id="nimi" placeholder="Lev">
    <br>
    <!-- ripploend või rippmenüü (en: dropdown list) -->
    <label for="stiil">Vali meeldivaim muusikastiil:</label>
    <br>
    <select name="stiil" id="stiil">
        <option value="vali">Vali...</option>
        <option value="rock">Rock</option>
        <option value="metal">Metal</option>
        <option value="heavyMetal">Heavy Metal</option>
        <option value="hardRock">Hard Rock</option>
        <option value="neueDeutscheHärte">Neue Deutsche Härte</option>
    </select>
    <br>
    <!-- radio nupud - üks valik mitmest -->
    <strong>
        Kuidas sa muusikat peamiselt kuulad?
    </strong>
    <br>
    <input type="radio" name="platvorm" id="spotify">
    <label for="spotify">Spotify</label>
    <br>
    <input type="radio" name="platvorm" id="youtubeMusic">
    <label for="youtubeMusic">Youtube Music</label>
    <br>
    <input type="radio" name="platvorm" id="soundcloud">
    <label for="soundcloud">Soundcloud</label>
    <br>
    <input type="radio" name="platvorm" id="raadio">
    <label for="raadio">Raadio</label>
    <br>
    <input type="radio" name="platvorm" id="vinüüplaat">
    <label for="vinüüplaat">Vinüüplaat</label>
</form>
</body>
</html>
